<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contexto Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="overlay-container"></div>

  <!-- Optional debug info -->
  <div id="debug-info">
    <div>Status: <span id="status">Initializing...</span></div>
    <div>Messages: <span id="message-count">0</span></div>
    <div>API calls: <span id="api-count">0</span></div>
    <div>Queue: <span id="queue-size">0</span></div>
  </div>

  <script type="module">
    import { ContextoOverlay } from './overlay.js';

    async function init() {
      const params = new URLSearchParams(window.location.search);

      const intParam = (key, fallback) => {
        const v = parseInt(params.get(key), 10);
        return Number.isFinite(v) ? v : fallback;
      };

      const config = {
        twitch: {
          enabled: !!params.get('twitch'),
          channel: params.get('twitch') || ''
        },
        kick: {
          enabled: !!params.get('kick'),
          channel: params.get('kick') || ''
        },
        debug: params.get('debug') === 'true',
        settings: {
          game: params.get('game') ? intParam('game', null) : null,
          minGame: intParam('minGame', 1),
          maxGame: intParam('maxGame', 1300),
          maxVisible: intParam('maxVisible', 15),
          endpoint: params.get('endpoint') || 'https://api.contexto.me/machado/en'
        }
      };

      const overlay = new ContextoOverlay(config);

      const debugInfo = document.getElementById('debug-info');
      const statusEl = document.getElementById('status');
      const messageCountEl = document.getElementById('message-count');
      let messageCount = 0;

      if (config.debug) {
        debugInfo.classList.add('visible');
      }

      const originalOnMessage = overlay.onMessage.bind(overlay);
      overlay.onMessage = function(message) {
        originalOnMessage(message);
        messageCount++;
        messageCountEl.textContent = messageCount;
      };

      await overlay.init();
      statusEl.textContent = 'Connected';

      window.overlay = overlay;
    }

    init().catch(error => {
      console.error('Failed to initialize overlay:', error);
      document.getElementById('status').textContent = 'Error: ' + error.message;
    });
  </script>
</body>
</html>
