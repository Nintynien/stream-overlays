<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reactive Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="overlay-container"></div>

  <!-- Optional debug info -->
  <div id="debug-info">
    <div>Status: <span id="status">Initializing...</span></div>
    <div>Messages: <span id="message-count">0</span></div>
    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.3);">
      <div style="margin-bottom: 5px;">Test Message:</div>
      <input type="text" id="test-message" placeholder="Type message..." style="width: 100%; padding: 4px; margin-bottom: 5px; font-family: monospace; font-size: 11px;">
      <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <label style="font-size: 10px;">
          <input type="checkbox" id="test-moderator"> Mod
        </label>
        <label style="font-size: 10px;">
          <input type="checkbox" id="test-subscriber"> Sub
        </label>
      </div>
      <button id="trigger-message" style="width: 100%; padding: 4px; cursor: pointer;">Send Test</button>
    </div>
  </div>

  <script type="module">
    import { ReactiveOverlay } from './overlay.js';

    // Initialize overlay
    async function init() {
      const params = new URLSearchParams(window.location.search);

      const config = {
        twitch: {
          enabled: !!params.get('twitch'),
          channel: params.get('twitch') || ''
        },
        kick: {
          enabled: !!params.get('kick'),
          channel: params.get('kick') || ''
        },
        settings: {}
      };

      const overlay = new ReactiveOverlay(config);

      // Optional: debug info
      const debugInfo = document.getElementById('debug-info');
      const statusEl = document.getElementById('status');
      const messageCountEl = document.getElementById('message-count');
      let messageCount = 0;

      // Show debug info if ?debug=true in URL
      if (params.get('debug') === 'true') {
        debugInfo.classList.add('visible');
      }

      // Override onMessage to update debug info
      const originalOnMessage = overlay.onMessage.bind(overlay);
      overlay.onMessage = function(message) {
        originalOnMessage(message);
        messageCount++;
        messageCountEl.textContent = messageCount;
      };

      await overlay.init();
      statusEl.textContent = 'Connected';

      // Test message trigger (for debug mode)
      const testMessageInput = document.getElementById('test-message');
      const testModCheckbox = document.getElementById('test-moderator');
      const testSubCheckbox = document.getElementById('test-subscriber');
      const triggerButton = document.getElementById('trigger-message');

      triggerButton.addEventListener('click', () => {
        const messageText = testMessageInput.value.trim();
        if (messageText) {
          const fakeMessage = {
            platform: 'test',
            username: 'TestUser',
            message: messageText,
            color: '#FF6B6B',
            moderator: testModCheckbox.checked,
            subscriber: testSubCheckbox.checked,
            timestamp: Date.now()
          };
          overlay.onMessage(fakeMessage);
          testMessageInput.value = ''; // Clear input
        }
      });

      // Allow Enter key to trigger
      testMessageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          triggerButton.click();
        }
      });

      // Make overlay accessible for debugging
      window.overlay = overlay;
    }

    init().catch(error => {
      console.error('Failed to initialize overlay:', error);
      document.getElementById('status').textContent = 'Error: ' + error.message;
    });
  </script>
</body>
</html>
